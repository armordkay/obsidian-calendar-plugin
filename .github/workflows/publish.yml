name: Release Calendar Deadlines

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate release metadata
        run: |
          node - <<'JS'
          const manifest = require('./manifest.json');
          const pkg = require('./package.json');
          const versions = require('./versions.json');
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          if (manifest.id !== pkg.name || manifest.version !== pkg.version || tag !== pkg.version || versions[tag] !== manifest.minAppVersion) {
            throw new Error('Release tag, package.json, manifest.json and versions.json must agree');
          }
          JS
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run build
      - name: Package plugin
        run: |
          mkdir calendar-deadlines
          cp main.js manifest.json styles.css calendar-deadlines/
          zip -r calendar-deadlines.zip calendar-deadlines
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css calendar-deadlines.zip --verify-tag --generate-notes --title "Calendar Deadlines $GITHUB_REF_NAME"
